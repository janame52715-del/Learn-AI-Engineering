
[project]
name = "ai-engineering-from-scratch"
version = "0.1.0"
description = "AI Engineering learning and development environment"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate==1.16.0",
    "anthropic==2.13.0",
    "datasets==5.2.0",
    "ipykernel==7.4.0",
    "jupyter==1.1.1",
    "matplotlib==3.11.2",
    "numpy==2.5.5",
    "pandas==3.1.1",
    "pillow==13.0.0",
    "scikit-learn==1.9.1",
    "tokenizers==0.23.3",
    "torch==2.6.0+cu124",
    "torchaudio==2.6.0+cu124",
    "torchvision==0.21.0+cu124",
    "transformers==5.24.1",
    "librosa>=0.10",
    "openai>=1.0",
    "soundfile>=0.12",
    "tiktoken>=0.5",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

